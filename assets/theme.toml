# built in themes:
#   catppuccin, dracula, nord, gruvbox, one-dark,
#   solarized, tailwind, tokyo-night, rose-pine, terminal
#
# custom themes:
#   theme = "my-theme"        (loads ~/.config/rmcl/theme/my-theme.toml)
#   theme = "/path/to/file"   (loads from absolute path)
# a theme file has flat top-level keys (name, id, accent, ...), not the
# [custom] table below. see assets/example-theme.toml in the repo.
theme = "gruvbox"

# rounded, plain, double, thick
border_style = "rounded"

# override current theme (not a custom theme):
# [custom]
# accent = { Rgb = [249, 115, 22] }
# text = "White"
# text_dim = "DarkGray"
# text_bright = "White"
# border = "Gray"
# surface = { Rgb = [36, 36, 36] }
# background = { Rgb = [30, 30, 30] }
# error = "Red"
# warning = "Yellow"
# success = "Green"
# info = "Cyan"
